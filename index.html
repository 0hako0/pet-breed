<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f6e9da" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>わんにゃんライフ 3D - ペット育成ゲーム</title>
  <!-- フォント: M PLUS Rounded 1c (SIL Open Font License 1.1 / Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <!-- 3Dエンジン: three.js r160 (MIT License) を CDN から読み込み -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="c"></canvas>

    <!-- ステータス -->
    <div id="status" class="card hidden">
      <div class="status-head">
        <div>
          <div id="pet-name" class="pet-name">-</div>
          <div id="pet-sub" class="pet-sub">-</div>
        </div>
        <div class="lv-badge"><span>Lv</span><b id="pet-lv">1</b></div>
      </div>
      <div class="exp-bar"><div id="exp-fill"></div></div>
      <div id="bars"></div>
      <div class="status-toggle" id="status-toggle">▼ くわしく</div>
    </div>

    <!-- 右上 -->
    <div id="topright" class="hidden">
      <div class="coins card">🪙 <b id="coins">0</b></div>
      <button class="chip-btn card" id="weather" title="今日の天気">🌸☀️</button>
      <button class="icon-btn" id="btn-pets" title="ペット一覧">🐾</button>
      <button class="icon-btn" id="btn-room" title="お部屋の模様替え">🛋️</button>
      <button class="icon-btn" id="btn-sound" title="音のON/OFF">🔊</button>
      <button class="icon-btn" id="btn-help" title="あそびかた">❓</button>
    </div>

    <!-- 散歩中の表示 -->
    <div id="walk-hud" class="card hidden">
      <div>🌳 おさんぽ中 <b id="walk-time">60</b>秒</div>
      <div class="walk-sub"><span class="kb-only">地面をクリックで移動・WASDキーでも歩けるよ<br></span><span class="touch-only">地面をタップするとそこへ歩くよ・</span>コイン🪙やおやつを拾おう！</div>
      <div class="walk-score">ひろったコイン: <b id="walk-coins">0</b></div>
      <button class="btn primary" id="btn-gohome">🏠 おうちに帰る</button>
    </div>

    <!-- 猫じゃらし中 -->
    <div id="play-hud" class="card hidden">
      <div>🪶 <span class="kb-only">マウスで</span><span class="touch-only">指でなぞって</span>猫じゃらしを動かそう！ <b id="play-time">12</b>秒</div>
    </div>

    <!-- フリスビー大会 -->
    <div id="fris-hud" class="card hidden">
      <div class="fris-top">
        <b>🥏 フリスビー大会</b>
        <span><b id="fris-round">1</b>/<span id="fris-total">10</span>投</span>
        <span>キャッチ <b id="fris-catch">0</b></span>
        <span class="fris-best">ベスト <b id="fris-best">0</b></span>
      </div>
      <div class="fris-gauge"><div class="zone good"></div><div class="zone perfect"></div><div class="needle" id="fris-needle"></div></div>
      <div class="fris-row">
        <div class="fris-msg" id="fris-msg"></div>
        <button class="btn primary" id="btn-throw">🥏 なげる！</button>
      </div>
      <div class="fris-sub"><span class="kb-only">スペースキーでもなげられるよ・</span>金色のところでなげるとパーフェクト！</div>
    </div>

    <!-- ふきだし -->
    <div id="bubble" class="bubble hidden"></div>

    <!-- 下のアクションバー -->
    <div id="actions" class="hidden">
      <button class="act" data-act="food"><span>🥣</span>ごはん</button>
      <button class="act" data-act="treat"><span>🍪</span>おやつ</button>
      <button class="act" data-act="play"><span>🎾</span>あそぶ</button>
      <button class="act" data-act="walk"><span>🌳</span>おさんぽ</button>
      <button class="act" data-act="trick"><span>🎓</span>芸</button>
      <button class="act" data-act="bath"><span>🛁</span>おふろ</button>
      <button class="act" data-act="brush"><span>🪮</span>ブラシ</button>
      <button class="act" data-act="sleep"><span>💤</span>ねる</button>
      <button class="act" data-act="dress"><span>🎀</span>きせかえ</button>
      <button class="act" data-act="shop"><span>🛒</span>ショップ</button>
      <button class="act" data-act="photo"><span>📷</span>しゃしん</button>
      <button class="act hidden" data-act="vet" id="btn-vet"><span>🏥</span>びょういん</button>
    </div>

    <!-- 汎用パネル -->
    <div id="panel" class="panel hidden">
      <div class="panel-inner card">
        <button class="close" id="panel-close">✕</button>
        <h2 id="panel-title"></h2>
        <div id="panel-body"></div>
      </div>
    </div>

    <!-- ペットをむかえる -->
    <div id="adopt" class="hidden">
      <div class="adopt-card card">
        <h2>🏠 ペットをおむかえしよう</h2>
        <div class="tabs">
          <button class="tab active" data-sp="dog">🐶 いぬ</button>
          <button class="tab" data-sp="cat">🐱 ねこ</button>
        </div>
        <div id="breed-list" class="breed-list"></div>
        <div id="breed-desc" class="breed-desc"></div>
        <div class="adopt-name">
          <label>なまえ <input id="adopt-name" maxlength="10" placeholder="なまえを入れてね" /></label>
          <button class="btn" id="btn-random-name">🎲</button>
        </div>
        <div class="adopt-btns">
          <button class="btn" id="btn-adopt-cancel">やめる</button>
          <button class="btn primary" id="btn-adopt">この子にきめた！</button>
        </div>
      </div>
    </div>

    <!-- タイトル -->
    <div id="title">
      <div class="title-card">
        <div class="title-paws">🐕 🐈 🐩 🐈‍⬛ 🦮</div>
        <h1>わんにゃんライフ<span>3D</span></h1>
        <p>いろんな犬種・猫種から家族をむかえて、<br>ごはん・おさんぽ・芸のトレーニングで育てよう！</p>
        <button class="btn primary big" id="btn-start">はじめる</button>
        <div class="title-note">データはこのブラウザに自動保存されます</div>
      </div>
    </div>

    <div id="toasts"></div>
    <div id="fade"></div>
    <div id="loading">よみこみ中…</div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
